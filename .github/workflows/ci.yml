name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5 #
        with:
          enable-cache: true # Caches the installed uv to speed up consecutive runs
          
      - name: Set up Python
        run: uv python install # Automatically installs the pinned Python version
        
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Run test suite
        run: uv run pytest